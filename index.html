
<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>কালীগঞ্জ আপডেট</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="manifest" href="manifest.json" />
    <script src="https://cdn.onesignal.com/sdks/OneSignalSDK.js" async></script>
    <script>
      window.OneSignal = window.OneSignal || [];
      OneSignal.push(function () {
        OneSignal.init({
          appId: "YOUR-ONESIGNAL-APP-ID", // এখানে তোমার OneSignal App ID বসাও
          notifyButton: {
            enable: true,
          },
        });
      });
    </script>
</head>
<body>
    <header>
        <h1>কালীগঞ্জ আপডেট</h1>
        <p>সকল খবর সবার আগে</p>
    </header>
    <main>
        <section class="hero">
            <h2>এই ওয়েবসাইটটি তৈরি করা হয়েছে আমাদের কালীগঞ্জ সাইটের সকল আপডেট জানার জন্য।</h2>
            <p>নতুন নোটিফিকেশন পেতে সাবস্ক্রাইব করুন।</p>
        </section>
    </main>
</body>
</html>
